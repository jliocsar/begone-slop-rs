id: no-stringly-match
valid:
  - 'fn run(mode: Mode) { match mode { Mode::Fast => go(), Mode::Slow => wait() } }'
  - 'impl FromStr for Mode { fn from_str(text: &str) -> Result<Self, Self::Err> { match text { "fast" => Ok(Mode::Fast), _ => Err(Unknown) } } }'
  - 'fn parse(argument: &str) -> Flag { match argument { "--fix" => Flag::Fix, _ => Flag::Other } }'
invalid:
  - 'fn run(mode: &str) { match mode { "fast" => go(), _ => wait() } }'
  - 'fn run(mode: String) { match mode.as_str() { "fast" | "quick" => go(), _ => wait() } }'
