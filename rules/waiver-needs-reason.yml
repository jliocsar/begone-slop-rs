id: waiver-needs-reason
language: Rust
severity: error
message: 'An ast-grep-ignore needs the rules it waives and a reason, like `// ast-grep-ignore: no-catch-unwind -- the FFI boundary must not unwind`.'
note: |
  A bare `ast-grep-ignore` waives every rule on the next line, and a waiver nobody explained
  is the slop the rule was there to catch.
rule:
  kind: line_comment
  regex: 'ast-grep-ignore'
  not:
    regex: 'ast-grep-ignore:\s*[\w-]+(\s*,\s*[\w-]+)*\s+--\s+\S'
