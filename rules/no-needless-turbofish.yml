id: no-needless-turbofish
language: Rust
severity: error
message: The `let` already names the type, so the turbofish says it a second time.
note: |
  `let total: i32 = numbers.iter().sum::<i32>();` reads as `let total: i32 = numbers.iter().sum();`.
  Keep one of the two: the type on the `let`, or the turbofish without it.
rule:
  kind: let_declaration
  all:
    - has:
        field: type
        regex: '.'
    - has:
        field: value
        any:
          - kind: call_expression
            has:
              field: function
              kind: generic_function
          - kind: try_expression
            has:
              kind: call_expression
              has:
                field: function
                kind: generic_function
